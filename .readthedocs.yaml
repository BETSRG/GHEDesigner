# Read the Docs configuration file
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    # Keep this aligned with .python-version so uv reuses RTD's interpreter.
    python: "3.14"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
