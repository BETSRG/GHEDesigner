# https://www.mkdocs.org/user-guide/configuration/
# https://squidfunk.github.io/mkdocs-material/creating-your-site/#advanced-configuration

site_name: GHEDesigner
repo_url: https://github.com/BETSRG/GHEDesigner
site_url:
  !ENV [READTHEDOCS_CANONICAL_URL, "https://ghedesigner.readthedocs.io/"]

theme:
  name: material

plugins:
  - search
  - schema_reader:
      include:
        - "ghedesigner/schemas/"
  - mkdocstrings:
      handlers:
        python:
          options:
            # https://mkdocstrings.github.io/griffe/reference/docstrings/
            docstring_style: sphinx

nav:
  - Home: index.md
  - Getting started:
      - Using the CLI: cli.md
      - Examples: examples.md
  - User guide:
      - Standalone GHE design: manager.md
      - District systems: district.md
  - Python API: api.md
  - Output contract:
      - Contract inventory: output_contract_inventory.md
      - Contract record API: output_api.md
      - Design and simulation flow: output_flow_plan.md

# Add these dirs/files to live updating during development (in addition to docs & this file)
# https://www.mkdocs.org/user-guide/configuration/#watch
watch:
  - ghedesigner/
